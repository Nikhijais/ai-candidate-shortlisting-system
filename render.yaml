services:
  - type: web
    name: ai-candidate-shortlisting
    env: node
    plan: free
    rootDir: server
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: MONGODB_URI
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
